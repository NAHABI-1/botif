name: validate-migrations

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  alembic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e database
      - env:
          MT5_DB_URL: postgresql+psycopg://localhost:5432/mt5_platform
        run: alembic -c database/alembic.ini upgrade head --sql
