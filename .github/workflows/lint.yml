name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.8.0
      - run: |
          ruff check services/engine/src services/worker/src services/api/src database/src
          black --check services/engine/src services/worker/src services/api/src database/src
